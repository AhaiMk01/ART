[project]
name = "art-mcp"
version = "0.1.0"
description = "MCP servers for the ART raw editor (Render and Live)"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
art-mcp-render = "art_mcp.render.server:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pillow>=12.3.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
