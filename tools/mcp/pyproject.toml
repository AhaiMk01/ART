[project]
name = "art-mcp"
version = "0.1.0"
description = "MCP servers for the ART raw editor (Render and Live)"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "pillow>=12.3.0"]

[project.scripts]
art-mcp-render = "art_mcp.render.server:main"
art-mcp-live = "art_mcp.live.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests copy raws and export full-size TIFFs (~800 MB a run);
# keep tmp_path folders only for failed tests.
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Reference values copied verbatim from ART's C++ output.
"tests/test_curves.py" = ["E501"]
